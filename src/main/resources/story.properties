# Chapters of the story, read in order: one bottle per chapter.
# chapter.0 is found from the start, every rod upgrade unlocks the next one.

chapter.0 = Se stai leggendo, la bottiglia ha trovato qualcuno.\n\
Mi chiamo Elia e pescavo su questo lago molto prima di te. Nelle sue acque più profonde \
nuota qualcosa che nessuno è mai riuscito a tirare su.\n\
Procurati una canna migliore: con il bambù non lo sentirai nemmeno abboccare.

chapter.1 = Vedo che hai cambiato canna. Bene.\n\
I lucci non sono il vero problema: sono le sentinelle. Restano vicini al fondo, \
dove il lago custodisce il suo segreto. Quando ne vedi uno, vuol dire che lui è vicino.\n\
Non fermarti adesso.

chapter.2 = Con questa canna ce la puoi fare. Io non ci sono riuscito: la mia lenza si è \
spezzata all'alba, e da allora il lago non mi ha più restituito niente.\n\
Se un giorno lo tirerai su, lascialo andare. Certe cose si pescano solo per poterle liberare.\n\
— Elia

# Endings, shown when the final fish is caught or breaks the line. Provisional texts.

ending.victory = Dopo un'ora di lotta la lenza smette di vibrare: dall'acqua nera emerge il pesce gatto \
più grande che tu abbia mai visto. Nella sua bocca, tra decine di ami arrugginiti, c'è anche quello di Elia.\n\
Al villaggio lo chiamavano il Signore del Lago. Ogni pescatore che ha provato a prenderlo \
è stato trascinato sul fondo, e nessuno è più tornato a raccontarlo.\n\
Questa volta è finita diversamente. Il lago, finalmente, è in pace.

ending.defeat = La lenza non si spezza: è la canna a strapparti dal pontile.\n\
L'acqua gelida ti chiude la bocca, e l'ultima cosa che vedi sono due occhi gialli che salgono dal buio.\n\
Il lago si richiude sopra di te, come si è richiuso sopra tutti gli altri.
