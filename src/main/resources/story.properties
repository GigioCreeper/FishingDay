# Chapters of the story, read in order: one bottle per chapter.
# chapter.0 is found from the start, every rod upgrade unlocks the next one.

chapter.0 = If you are reading this, the bay is yours now. I am sorry.\n\
They will have told you it came cheap. They will not have told you why. \
Ask what happened to the last owner. Ask about the one before.\n\
There is something down there that no one has ever pulled up.

chapter.1 = Five families have owned this bay. None of them ever sold it.\n\
Each one fished these waters. Each one went out one morning and never came back, \
and the boat was found tied to the dock, the water perfectly still.\n\
It does not take them at random. It waits until their line is strong enough to interest it.

chapter.2 = Tonight my line moved on its own.\n\
I know now what took them. I have seen its eyes under the dock, yellow and patient.\n\
I am going out at dawn. If this bottle has reached you, I did not come back, \
and the bay is yours to answer for.\n\
J.

# Endings, shown when the final fish is caught or breaks the line.

ending.victory = The line goes slack, and the black water gives up its monster: \
a catfish larger than any you have ever seen, its yellow eyes already dull.\n\
Rusted hooks hang from its jaw, one for every owner of the bay.\n\
By morning the water moves again, and the birds cross it for the first time anyone can remember.\n\
The lake is free.

ending.defeat = The line does not break. The rod tears you from the dock.\n\
The cold closes over you as two yellow eyes rise out of the dark. It drags you down, \
past the rusted hooks of those who came before you, to where the light ends.\n\
You do not come back up.\n\
By morning your boat is tied to the dock, the water perfectly still, and the bay is for sale again.
